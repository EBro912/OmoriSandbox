name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # the Godot.NET.Sdk resolves from NuGet, so compiling needs no engine download
      - name: Build
        run: dotnet build OmoriSandbox.sln
